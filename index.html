<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snake</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <h1>Snake</h1>
        <div class="hud-row">
          <p id="score" class="metric">Score: 0</p>
          <p id="status" class="metric">Running</p>
        </div>
      </header>

      <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>

      <section class="actions">
        <button id="pauseBtn" type="button">Pause</button>
        <button id="restartBtn" type="button">Restart</button>
      </section>

      <section class="controls" aria-label="On-screen controls">
        <button type="button" data-direction="UP">Up</button>
        <div class="controls-row">
          <button type="button" data-direction="LEFT">Left</button>
          <button type="button" data-direction="DOWN">Down</button>
          <button type="button" data-direction="RIGHT">Right</button>
        </div>
      </section>

      <p class="help">Use Arrow keys or WASD. Space toggles pause. Enter restarts after game over.</p>
    </main>

    <script src="./snake-logic.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
